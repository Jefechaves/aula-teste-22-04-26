<!DOCTYPE html>

<head>
    <title>Calculadora com Testes</title>

    <script>

        
        function pegarValores() {
            return {
                n1: parseFloat(document.getElementById("num1").value),
                n2: parseFloat(document.getElementById("num2").value)
            };
        }

        function mostrarResultado(texto) {
            document.getElementById("resultado").innerHTML = texto;
        }

        function validarNumeros(n1, n2) {
            return !isNaN(n1) && !isNaN(n2);
        }

        function somar() {
            const { n1, n2 } = pegarValores();

            if (!validarNumeros(n1, n2)) {
                mostrarResultado("Valores inválidos");
                return;
            }

            mostrarResultado(`Resultado: ${n1 + n2}`);
        }

        function subtrair() {
            const { n1, n2 } = pegarValores();

            if (!validarNumeros(n1, n2)) {
                mostrarResultado("Valores inválidos");
                return;
            }

            mostrarResultado(`Resultado: ${n1 - n2}`);
        }

        function multiplicar() {
            const { n1, n2 } = pegarValores();

            if (!validarNumeros(n1, n2)) {
                mostrarResultado("Valores inválidos");
                return;
            }

            mostrarResultado(`Resultado: ${n1 * n2}`);
        }

        function dividir() {
            const { n1, n2 } = pegarValores();

            if (!validarNumeros(n1, n2)) {
                mostrarResultado("Valores inválidos");
                return;
            }

            if (n2 === 0) {
                mostrarResultado("Não é possível dividir por zero!");
                return;
            }

            mostrarResultado(`Resultado: ${n1 / n2}`);
        }

        
        // TESTES//
        

        let testesPassaram = 0;
        let testesFalharam = 0;

        function executarTeste(nome, esperado, funcao) {

            funcao();

            const resultadoAtual =
                document.getElementById("resultado").innerHTML;

            if (resultadoAtual === esperado) {
                console.log(` ${nome}`);
                testesPassaram++;
            } else {
                console.error(` ${nome}`);
                console.error("Esperado:", esperado);
                console.error("Obtido:", resultadoAtual);
                testesFalharam++;
            }
        }

    
        
        function testarSomar() {

            document.getElementById("num1").value = 5;
            document.getElementById("num2").value = 5;

            executarTeste(
                "Teste Somar",
                "Resultado: 10",
                somar
            );
        }

        function testarSubtrair() {

            document.getElementById("num1").value = 10;
            document.getElementById("num2").value = 3;

            executarTeste(
                "Teste Subtrair",
                "Resultado: 7",
                subtrair
            );
        }

        function testarMultiplicar() {

            document.getElementById("num1").value = 4;
            document.getElementById("num2").value = 5;

            executarTeste(
                "Teste Multiplicar",
                "Resultado: 20",
                multiplicar
            );
        }

        function testarDividir() {

            document.getElementById("num1").value = 20;
            document.getElementById("num2").value = 5;

            executarTeste(
                "Teste Dividir",
                "Resultado: 4",
                dividir
            );
        }

        
        
        function testarInputVazio() {

            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";

            executarTeste(
                "Teste Input Vazio",
                "Valores inválidos",
                somar
            );
        }

        function testarDivisaoPorZero() {

            document.getElementById("num1").value = 10;
            document.getElementById("num2").value = 0;

            executarTeste(
                "Teste Divisão por Zero",
                "Não é possível dividir por zero!",
                dividir
            );
        }

        
        
        function testeComponente() {

            document.getElementById("num1").value = 8;
            document.getElementById("num2").value = 2;

            document.querySelector("button[onclick='somar()']").click();

            executarTeste(
                "Teste de Componente",
                "Resultado: 10",
                () => {}
            );
        }

        
        
        function rodarTodosOsTestes() {

            console.clear();

            testesPassaram = 0;
            testesFalharam = 0;

            console.log("INICIANDO TESTES");

            testarSomar();
            testarSubtrair();
            testarMultiplicar();
            testarDividir();

            testarInputVazio();
            testarDivisaoPorZero();

            testeComponente();

            console.log("================================");
            console.log(" Passaram:", testesPassaram);
            console.log(" Falharam:", testesFalharam);

            alert(
                `Testes finalizados\n\n Passaram: ${testesPassaram}\n Falharam: ${testesFalharam}`
            );
        }

    </script>
</head>

<body>

    <input id="num1" type="number" placeholder="Número 1">
    <input id="num2" type="number" placeholder="Número 2">

    <br><br>

    <button onclick="somar()">Somar</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>

    <br><br>

    <button onclick="rodarTodosOsTestes()">
        Rodar TODOS os Testes
    </button>

    <br><br>

    <div id="resultado">Resultado:</div>

</body>

</html>
